name: Paket

# Baut die Installationspakete (Spezifikation D-3) und prüft sie mit dem
# Selbsttest; ein Tag v* legt damit ein Release an.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    name: Paket (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
          - os: macos-latest
            system: macos
          - os: ubuntu-latest
            system: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group paket
      - name: Version prüfen
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          grep -q "^VERSION = \"$version\"" config/settings.py
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Programmordner bauen
        env:
          APP_DATA_DIR: ${{ runner.temp }}/bau
        run: |
          uv run pyinstaller packaging/kontorfreund.spec --noconfirm
          # Die AGPL verlangt den Lizenztext bei jeder Weitergabe.
          cp LICENSE dist/Kontorfreund/LICENSE.txt
      - name: Selbsttest
        env:
          APP_DATA_DIR: ${{ runner.temp }}/selbsttest
        run: |
          dist/Kontorfreund/Kontorfreund migrate --verbosity 0
          dist/Kontorfreund/Kontorfreund selbsttest
      - name: Start prüfen
        env:
          APP_DATA_DIR: ${{ runner.temp }}/start
          APP_KEIN_BROWSER: "1"
        run: |
          dist/Kontorfreund/Kontorfreund &
          for i in $(seq 1 60); do
            curl -fsSL -o seite.html http://127.0.0.1:8765/ && break
            sleep 1
          done
          grep -q "Willkommen bei Kontorfreund" seite.html
          curl -fsS -o /dev/null http://127.0.0.1:8765/static/css/app.css
          if [[ "$RUNNER_OS" == Windows ]]; then taskkill //F //IM Kontorfreund.exe; else kill %1; fi

      # Portable Fassung: der Programmordner mit portabel.txt als ZIP. Geprüft wird das fertige
      # Archiv, entpackt wie von Hand und ohne APP_DATA_DIR, damit der Weg zu den Daten echt ist.
      - name: Portable Fassung packen und prüfen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bau = "$env:RUNNER_TEMP\portabel-bau\Kontorfreund"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\portabel-bau" | Out-Null
          Copy-Item -Recurse dist\Kontorfreund $bau
          Copy-Item packaging\windows\portabel.txt $bau
          $zip = "dist\Kontorfreund-$env:VERSION-windows-portabel.zip"
          7z a -tzip -bso0 $zip $bau
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive $zip "$env:RUNNER_TEMP\portabel-probe"
          $ordner = "$env:RUNNER_TEMP\portabel-probe\Kontorfreund"
          & "$ordner\Kontorfreund.exe" migrate --verbosity 0
          & "$ordner\Kontorfreund.exe" selbsttest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$ordner\Daten\db.sqlite3")) { throw "Die Daten liegen nicht neben dem Programm." }
          if (Test-Path "$env:LOCALAPPDATA\Kontorfreund") { throw "Die portable Fassung schreibt in den Benutzerordner." }
          $env:APP_KEIN_BROWSER = "1"
          Start-Process "$ordner\Kontorfreund.exe"
          foreach ($i in 1..60) {
            curl.exe -fsSL -o seite.html http://127.0.0.1:8766/
            if (-not $LASTEXITCODE) { break }
            Start-Sleep 1
          }
          if ($LASTEXITCODE) { throw "Die portable Fassung startet nicht auf Port 8766." }
          if (-not (Select-String -Quiet "Willkommen bei Kontorfreund" seite.html)) { throw "Die Startseite fehlt." }
          taskkill /F /IM Kontorfreund.exe

      - name: Installationsprogramm bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" packaging\windows\kontorfreund.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installieren, prüfen, deinstallieren
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ziel = "$env:ProgramFiles\Kontorfreund"
          Start-Process -Wait "dist\Kontorfreund-Setup-$env:VERSION.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $env:APP_DATA_DIR = "$env:RUNNER_TEMP\installiert-daten"
          & "$ziel\Kontorfreund.exe" migrate --verbosity 0
          & "$ziel\Kontorfreund.exe" selbsttest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process -Wait "$ziel\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if (Test-Path "$ziel\Kontorfreund.exe") { throw "Die Deinstallation hat das Programm nicht entfernt." }
          if (-not (Test-Path "$env:APP_DATA_DIR\db.sqlite3")) { throw "Die Deinstallation hat die Daten gelöscht." }
      # Bis 0.28 lag das Programm im Benutzerordner. Geprüft wird mit dem echten alten Paket, das gerade läuft
      # und beim Anmelden startet: erst allein, dann neben einer schon vorhandenen neuen Installation.
      - name: Frühere Installation ersetzen
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.28.1 --pattern Kontorfreund-Setup-0.28.1.exe --dir alt
          $alt = "$env:LOCALAPPDATA\Programs\Kontorfreund"
          $neu = "$env:ProgramFiles\Kontorfreund"
          $eintrag = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{52BF44B4-6F13-4902-8F7A-13F8263453E4}_is1"
          $start = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $start)) { New-Item $start | Out-Null }
          function Installieren($datei) {
            $lauf = Start-Process -Wait -PassThru $datei -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            if ($lauf.ExitCode) { throw "$datei endete mit $($lauf.ExitCode)." }
          }
          foreach ($runde in 1, 2) {
            Installieren "alt\Kontorfreund-Setup-0.28.1.exe"
            if (-not (Test-Path $eintrag)) { throw "Die frühere Installation steht nicht unter HKCU." }
            Start-Process "$alt\Kontorfreund.exe" -ArgumentList "--hintergrund"
            foreach ($i in 1..60) {
              curl.exe -fs -o NUL http://127.0.0.1:8765/
              if (-not $LASTEXITCODE) { break }
              Start-Sleep 1
            }
            if ($LASTEXITCODE) { throw "Die frühere Version startet nicht." }
            Set-ItemProperty $start Kontorfreund "`"$alt\Kontorfreund.exe`" --hintergrund"
            Installieren "dist\Kontorfreund-Setup-$env:VERSION.exe"
            if (Test-Path "$alt\Kontorfreund.exe") { throw "Die frühere Installation ist noch da." }
            if (Test-Path $eintrag) { throw "Der Eintrag der früheren Installation ist noch da." }
            if (Get-Process Kontorfreund -ErrorAction SilentlyContinue) { throw "Die frühere Version läuft noch." }
            if (-not (Test-Path "$neu\Kontorfreund.exe")) { throw "Das neue Programm fehlt." }
            if ((Get-ItemPropertyValue $start Kontorfreund) -ne "`"$neu\Kontorfreund.exe`" --hintergrund") {
              throw "Der Start beim Anmelden zeigt nicht auf das neue Programm."
            }
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Kontorfreund\db.sqlite3")) { throw "Die Daten fehlen." }
          & "$neu\Kontorfreund.exe" migrate --verbosity 0
          & "$neu\Kontorfreund.exe" selbsttest
      - name: Archiv packen
        if: runner.os != 'Windows'
        run: tar -czf "dist/Kontorfreund-$VERSION-${{ matrix.system }}-$(uname -m).tar.gz" -C dist Kontorfreund

      - uses: actions/upload-artifact@v7
        with:
          name: paket-${{ matrix.system }}
          path: |
            dist/Kontorfreund-Setup-*.exe
            dist/Kontorfreund-*.zip
            dist/Kontorfreund-*.tar.gz
          if-no-files-found: error

  veroeffentlichen:
    name: Release anlegen
    needs: bauen
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: pakete
          merge-multiple: true
      - uses: astral-sh/setup-uv@v7
      # Stückliste aller Bibliotheken im Paket, CycloneDX (OWASP ASVS 15.1.2).
      - name: SBOM
        run: >-
          uv export --format cyclonedx1.5 --preview-features sbom-export --no-dev --locked
          -o "pakete/Kontorfreund-${GITHUB_REF_NAME#v}-sbom.cdx.json" > /dev/null
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Feste Namen ohne Version: Webseite und README verlinken
          # releases/latest/download/<Name>, das muss bei jedem Release stimmen.
          cp "pakete/Kontorfreund-Setup-$version.exe" pakete/Kontorfreund-Setup.exe
          cp "pakete/Kontorfreund-$version-windows-portabel.zip" pakete/Kontorfreund-windows-portabel.zip
          cp "pakete/Kontorfreund-$version-macos-arm64.tar.gz" pakete/Kontorfreund-macos-arm64.tar.gz
          cp "pakete/Kontorfreund-$version-linux-x86_64.tar.gz" pakete/Kontorfreund-linux-x86_64.tar.gz
          awk -v kopf="## $version " 'index($0, kopf) == 1 {an = 1; next} /^## / {an = 0} an' CHANGELOG.md > notizen.md
          test -s notizen.md
          gh release create "$GITHUB_REF_NAME" pakete/* --title "Kontorfreund $version" --notes-file notizen.md
