name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Migrationen, Abhängigkeiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt --require-hashes --disable-pip

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest

  e-rechnung:
    name: E-Rechnungen mit KoSIT und Mustang prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prüfwerkzeuge laden
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o validator.zip https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3.zip
          curl -fsSL -o xrechnung.zip https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
          curl -fsSL -o mustang.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
          curl -fsSL -o testsuite.zip https://github.com/itplr-kosit/xrechnung-testsuite/releases/download/v2026-08-31/xrechnung-3.0.2-testsuite-2026-08-31.zip
          sha256sum --check --strict <<'EOF'
          95d5a399ff5186dae5ddb7edd9a14a9c8352610159a90bfa27d4739a8bc37822  validator.zip
          2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8  xrechnung.zip
          42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  mustang.jar
          1e81ef7563e0fa04c0e0b0631318a7e0843a3c0beb57d83ef95ac0c4a095e3d7  testsuite.zip
          EOF
          unzip -q validator.zip -d kosit
          unzip -q xrechnung.zip -d xrechnung
          unzip -q testsuite.zip -d testsuite
          {
            echo "KOSIT_VALIDATOR=$PWD/kosit"
            echo "KOSIT_KONFIGURATION=$PWD/xrechnung"
            echo "MUSTANG=$PWD/mustang.jar"
            echo "XRECHNUNG_TESTSUITE=$PWD/testsuite/instances"
          } >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest tests/test_validierung.py tests/test_eingang.py -v
