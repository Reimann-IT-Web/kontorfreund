<th scope="col"{% if klasse %} class="{{ klasse }}"{% endif %}{% if s.richtung %} aria-sort="{{ s.richtung }}"{% endif %}><a href="{{ s.adresse }}" title="{% if s.richtung %}Reihenfolge umdrehen{% else %}Nach {{ name }} sortieren{% endif %}">{{ titel }}{% if s.richtung == "ascending" %}<span aria-hidden="true"> ↑</span>{% elif s.richtung == "descending" %}<span aria-hidden="true"> ↓</span>{% endif %}</a></th>
