[project]
name = "kontorfreund"
version = "0.28.1"
description = "Open-Source-CRM und Rechnungsprogramm für Kleinunternehmer"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "django>=6.1,<6.2",
    "drafthorse>=2025.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "segno>=1.6.6",
    "typst>=0.15.0",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]
paket = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
# Zeilenlänge regelt der Formatierer; lange Textkonstanten bleiben ungebrochen.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
