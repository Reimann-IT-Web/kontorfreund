[project]
name = "kontorfreund"
version = "0.0.0"
description = "Open-Source-CRM und Rechnungsprogramm für Kleinunternehmer"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
# Zeilenlänge regelt der Formatierer; lange Textkonstanten bleiben ungebrochen.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
